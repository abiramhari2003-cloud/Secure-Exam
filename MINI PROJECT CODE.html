<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online Exam System</title>
  <!-- face-api.js included but not used in this version -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .center-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
      display: none;
      flex-direction: column;
    }
    .container.active { display: flex; }
    h2 { text-align: center; color: #4e54c8; margin-bottom: 20px; }
    label { font-weight: bold; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px;
      border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
    }
    button {
      width: 100%; padding: 12px; background: #4e54c8; color: #fff;
      font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #363bd1; }
    .warning { color: red; font-weight: bold; white-space: pre-line; }
    #video { border: 2px solid #444; margin-top: 10px; width: 100%; }
    .question { margin-top: 15px; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>

<div class="center-wrapper">
  <div class="container active" id="loginPage">
    <h2>Login to Exam System</h2>
    <form onsubmit="login(event)">
      <label>Username:</label>
      <input type="text" id="username" placeholder="Enter your username">
      <label>Password:</label>
      <input type="password" id="password" placeholder="Enter your password">
      <button type="submit">Login</button>
    </form>
    <p style="font-size:12px;margin-top:10px;color:#666">Use <b>admin/admin123</b> or <b>student/stud123</b></p>
  </div>

  <div class="container" id="examPage">
  <h2>Online Exam - Student</h2>
  <p class="warning" id="warnings"></p>
  <video id="video" height="200" autoplay muted></video>

  <!--  New name input -->
  <label>Enter your Name:</label>
  <input type="text" id="studentName" placeholder="Enter your full name">

  <div id="questionsContainer"></div>
  <button onclick="submitAnswers()">Submit Test</button>
</div>

    <div class="container" id="adminPage">
  <h2>Admin Dashboard</h2>
  <p>Set Questions for Exam</p>

  <textarea id="questionInput" placeholder="Enter a question"></textarea><br>
  <button onclick="addQuestion()">Add Question</button>
  <button onclick="clearQuestions()" style="margin-top:10px;background:#e74c3c;">Clear All Questions</button>

  <h3 style="margin-top:20px;">Current Questions:</h3>
  <ul id="questionList"></ul>

  <!--  Student submissions section -->
  <h3 style="margin-top:20px;">Student Submissions:</h3>
  <button onclick="clearSubmissions()" style="margin-top:10px;background:#e67e22;">Clear Submissions</button>
  <ul id="submissionList"></ul>

  <!--  Finalize and logout button -->
  <button onclick="finalizeQuestions()" style="margin-top:20px;background:#2ecc71;">Finalize & Logout</button>
</div>

<audio id="alarm" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<script>
  const warningsEl = document.getElementById("warnings");
  const questionList = document.getElementById("questionList");
  const questionsContainer = document.getElementById("questionsContainer");
  const alarm = document.getElementById("alarm");
  let isStudent = false;

  // For convenience: ensure questions key exists (optional)
  if (!localStorage.getItem('questions')) {
    localStorage.setItem('questions', JSON.stringify([]));
  }

  function login(event) {
    event.preventDefault();
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    // hide all pages
    document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));

    if (user === "admin" && pass === "admin123") {
      document.getElementById("adminPage").classList.add("active");
      loadQuestions();
    } else if (user === "student" && pass === "stud123") {
      isStudent = true;
      document.getElementById("examPage").classList.add("active");
      loadExam();
      askMicrophonePermission();
    } else {
      alert("Invalid credentials!");
      document.getElementById("loginPage").classList.add("active");
    }
  }
    function finalizeQuestions() {
    // Save is already done via addQuestion/clearQuestions,
    // so just move admin back to login page
    alert("Questions finalized. Logging out...");
    document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
    document.getElementById("loginPage").classList.add("active");
  }

  function addQuestion() {
    const q = document.getElementById("questionInput").value.trim();
    if (q === "") return;
    let questions = JSON.parse(localStorage.getItem("questions") || "[]");
    questions.push(q);
    localStorage.setItem("questions", JSON.stringify(questions));
    document.getElementById("questionInput").value = "";
    loadQuestions();
  }

  function clearQuestions() {
    localStorage.removeItem("questions");
    localStorage.setItem('questions', JSON.stringify([]));
    loadQuestions();
  }

  function loadQuestions() {
  questionList.innerHTML = "";
  const questions = JSON.parse(localStorage.getItem("questions") || "[]");
  questions.forEach((q, i) => {
    const li = document.createElement("li");
    li.innerText = (i + 1) + ". " + q;
    questionList.appendChild(li);
  });

  // Load submissions
  const submissionList = document.getElementById("submissionList");
  submissionList.innerHTML = "";
  const submissions = JSON.parse(localStorage.getItem("submissions") || "[]");
  submissions.forEach((s, i) => {
    const li = document.createElement("li");
    li.innerText = `${i+1}. ${s.name} - Answers: ${s.answers.join(", ")}`;
    submissionList.appendChild(li);
  });
}
function clearSubmissions() {
  localStorage.removeItem("submissions");
  loadQuestions(); // reload admin view so the list clears
}

  function loadExam() {
    const questions = JSON.parse(localStorage.getItem("questions") || "[]");
    questionsContainer.innerHTML = "";
    if (questions.length === 0) {
      questionsContainer.innerHTML = "<p>No questions yet. Ask admin to add questions.</p>";
      return;
    }
    questions.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "question";
      // use backticks for template string
      div.innerHTML = `<b>Q${i + 1}:</b> ${q}<br><textarea id="ans${i}"></textarea>`;
      questionsContainer.appendChild(div);
    });
  }
    function submitAnswers() {
  const studentName = document.getElementById("studentName").value.trim();
  if (!studentName) {
    alert("Please enter your name before submitting!");
    return;
  }
  

  const questions = JSON.parse(localStorage.getItem("questions") || "[]");
  const answers = questions.map((_, i) => document.getElementById(`ans${i}`).value);

  // Save submission in localStorage
  let submissions = JSON.parse(localStorage.getItem("submissions") || "[]");
  submissions.push({
    name: studentName,
    answers: answers
  });
  localStorage.setItem("submissions", JSON.stringify(submissions));

  alert("Test submitted successfully!\n\n" + 
        answers.map((a, i) => `Q${i+1}: ${a}`).join("\n"));

  //  Stop camera and microphone
  const video = document.getElementById("video");
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }

  //  Logout student and return to login page
  isStudent = false;
  document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
  document.getElementById("loginPage").classList.add("active");
}


  async function askMicrophonePermission() {
    try {
      // ask for both audio and video
      await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      startMonitoring();
    } catch (err) {
      warningsEl.innerText += "\n[Microphone or Webcam Access Denied]";
      console.error(err);
    }
  }

  async function startMonitoring() {
    const video = document.getElementById("video");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      video.srcObject = stream;
    } catch (err) {
      warningsEl.innerText += "\n[Cannot start camera/mic]";
      console.error(err);
      return;
    }

    // Audio analyser
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const mic = audioContext.createMediaStreamSource(video.srcObject);
    const analyser = audioContext.createAnalyser();
    mic.connect(analyser);
    analyser.fftSize = 256;
    const data = new Uint8Array(analyser.frequencyBinCount);
    let multiVoiceCount = 0;

    function detectVolume() {
      analyser.getByteFrequencyData(data);
      let volume = 0;
      for (let v of data) volume += v;
      // threshold is empirical for demo; tweak if noisy
      if (volume > 10000) {
        multiVoiceCount++;
        warningsEl.innerText += "\n[High Volume Detected] (" + multiVoiceCount + ")";
        if (isStudent) {
          alarm.play().catch(() => {});
        }
      }
      requestAnimationFrame(detectVolume);
    }
    detectVolume();

    // Tab switch detection
    let tabWarningCount = 0;
    window.onblur = () => {
      tabWarningCount++;
      warningsEl.innerText += "\n[Tab Switch Detected] (" + tabWarningCount + ")";
    };

    // Inactivity detection
    let lastActivity = Date.now();
    ["mousemove", "keydown", "click"].forEach(evt =>
      document.addEventListener(evt, () => lastActivity = Date.now())
    );
    setInterval(() => {
      if (Date.now() - lastActivity > 10000) { // 10 seconds of inactivity => demo warning
        warningsEl.innerText += "\n[Inactivity Detected]";
      }
    }, 5000);
  }
</script>
</body>
</html>
